name: Zero-Downtime Deployment POC Test

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-zero-downtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Deploy Initial Version (v1)
        run: |
          mkdir -p logs

          echo "APP_VERSION=v1" > .env
          docker compose up -d --build

          echo "Waiting for app to become healthy..."
          healthy=0
          for i in {1..60}; do
            if curl -sS --connect-timeout 2 --max-time 3 http://localhost:3000/health | grep -q "UP"; then
              echo "✅ App v1 is healthy!"
              healthy=1
              break
            else
              echo "Attempt $i: not healthy yet"
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            echo "❌ Timed out waiting for app"
            echo "--- Dumping container logs for debugging ---"
            docker compose logs api --no-color > logs/app_startup.log || true
            cat logs/app_startup.log || true
            exit 1
          fi

      - name: 2. Start Background Traffic Generator (Load Test)
        run: |
          echo "🚀 Starting continuous background traffic..."
          mkdir -p logs

          (
            for i in {1..100}; do
              http_code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 2 --max-time 5 http://localhost:3000/health || true)
              curl_exit=$?
              if [ "$curl_exit" -ne 0 ]; then
                status="000"
              else
                status="$http_code"
              fi

              echo "$(date +%T) - Status: $status (curl_exit=$curl_exit, http_code=$http_code)" >> logs/traffic.log

              if [ "$status" != "200" ]; then
                echo "FAILED_REQUEST at $(date +%T) with status $status (curl_exit=$curl_exit, http_code=$http_code)" >> logs/failures.log
                echo "=== Diagnostic: verbose curl output at $(date +%T) ===" >> logs/failure_diagnostics.log
                curl -v --connect-timeout 2 --max-time 5 http://localhost:3000/health >> logs/failure_diagnostics.log 2>&1 || true
                echo "=== End Diagnostic ===" >> logs/failure_diagnostics.log
              fi

              sleep 0.2
            done
          ) &

          echo "Traffic generator running in background."

      - name: 3. Trigger Rolling Update to Version (v2)
        run: |
          sleep 3

          echo "🔄 Updating app version to v2..."
          echo "APP_VERSION=v2" > .env

          docker compose up -d --build --remove-orphans

          sleep 15

      - name: 4. Verify Zero-Downtime Results
        run: |
          echo "--- Traffic Summary Log ---"
          cat logs/traffic.log || true

          if [ -f logs/failures.log ]; then
            echo "❌ Zero-downtime test FAILED! Dropped requests found:"
            cat logs/failures.log

            echo
            echo "--- Failure diagnostics (verbose curl output) ---"
            cat logs/failure_diagnostics.log || true

            echo
            echo "--- App container logs ---"
            docker compose logs api --no-color || true
            exit 1
          else
            echo "✅ SUCCESS! Zero downtime achieved. All requests returned HTTP 200 during the update."
          fi

      - name: 5. Cleanup Docker Containers
        if: always()
        run: |
          docker compose down

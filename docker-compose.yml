version: '3.9'

services:
  api:
    build: .
    image: dummy-json-app:latest
    container_name: zero_downtime_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - APP_VERSION=v1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
